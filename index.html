<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今天吃什么？</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍🍳</text></svg>"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --warm-orange: #FF8A65;
        --warm-yellow: #FFF59D;
        --warm-green: #A5D6A7;
        --warm-bg: #FFFBF0;
        --soft-text: #4E342E;
      }
      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--warm-bg);
        color: var(--soft-text);
        background-image: radial-gradient(rgba(139, 69, 19, 0.05) 10%, transparent 10%);
        background-size: 20px 20px;
      }
      .neo-shadow {
        box-shadow: 4px 6px 15px -2px rgba(139, 69, 19, 0.1);
        border: 2px solid rgba(139, 69, 19, 0.1);
      }
      .neo-shadow-lg {
        box-shadow: 6px 10px 25px -5px rgba(139, 69, 19, 0.12);
        border: 2px solid rgba(139, 69, 19, 0.1);
      }
      .neo-shadow-hover:active {
        box-shadow: 2px 2px 5px 0px rgba(139, 69, 19, 0.1);
        transform: translate(2px, 2px);
      }

      /* Soft drawn effect for inputs */
      .hand-drawn-input {
        border: 2px solid rgba(139, 69, 19, 0.2);
        border-radius: 12px;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        transition: all 0.3s ease;
      }
      .hand-drawn-input:focus {
        transform: scale(1.01);
        box-shadow: 0 0 0 3px rgba(255, 138, 101, 0.3);
        border-color: var(--warm-orange);
        outline: none;
      }

      /* Marquee */
      @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        display: inline-block;
        white-space: nowrap;
        animation: marquee 15s linear infinite;
      }

      /* Cooking Animation Keyframes (softer) */
      @keyframes fry {
        0%, 100% { transform: translateY(0) rotate(0); }
        25% { transform: translateY(-8px) rotate(-5deg); }
        50% { transform: translateY(0) rotate(0); }
        75% { transform: translateY(-4px) rotate(5deg); }
      }
      @keyframes sizzle {
        0%, 100% { opacity: 0; transform: translateY(0) scale(0.8); }
        50% { opacity: 0.8; transform: translateY(-20px) scale(1.2); }
      }
      @keyframes star-flicker {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.9); }
      }
      .animate-fry { animation: fry 0.8s infinite ease-in-out; }
      .animate-sizzle { animation: sizzle 1s infinite ease-out; }
      .star { animation: star-flicker 1.5s infinite alternate; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: var(--warm-bg); }
      ::-webkit-scrollbar-thumb { 
        background: rgba(139, 69, 19, 0.2); 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(139, 69, 19, 0.4); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
